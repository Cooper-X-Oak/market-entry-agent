name: industrial-market-entry-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: imea
      POSTGRES_USER: imea_owner
      POSTGRES_PASSWORD: imea_owner
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sql:/docker-entrypoint-initdb.d/001-imea-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imea_owner -d imea"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-migrate:
    build:
      context: .
      args:
        APP: api
    command: ["pnpm", "--filter", "@imea/database", "db:migrate"]
    environment:
      DATABASE_MIGRATOR_URL: postgresql://imea_migrator:imea_migrator@postgres:5432/imea
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: imea_owner
      POSTGRES_PWD: imea_owner
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.39.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/market-entry"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      args:
        APP: api
    env_file: .env
    environment:
      DATABASE_API_URL: postgresql://imea_api:imea_api@postgres:5432/imea
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT: http://minio:9000
    ports:
      - "4000:4000"
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      args:
        APP: worker
    env_file: .env
    environment:
      DATABASE_WORKER_URL: postgresql://imea_worker:imea_worker@postgres:5432/imea
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  projector:
    build:
      context: .
      args:
        APP: projector
    env_file: .env
    environment:
      DATABASE_PROJECTOR_URL: postgresql://imea_projector:imea_projector@postgres:5432/imea
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      args:
        APP: web
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    env_file: .env
    environment:
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
